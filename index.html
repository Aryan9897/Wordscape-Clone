<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07061a" />
    <meta name="description" content="A calm, endless word puzzle set in cities at night." />
    <title>Skyline Words</title>
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <canvas id="sky" aria-hidden="true"></canvas>
    <div class="veil" aria-hidden="true"></div>

    <main id="app">
      <!-- Home -->
      <section id="home" class="screen active">
        <div class="home-top">
          <button class="coins pill" aria-label="Coins">
            <i class="coin-ico"></i><span class="coin-count">0</span><b class="plus">+</b>
          </button>
          <button id="btn-settings" class="icon-btn" aria-label="Settings"></button>
        </div>

        <div class="logo">
          <div class="logo-tiles" aria-hidden="true">
            <span>S</span><span>K</span><span>Y</span>
          </div>
          <h1>Skyline <em>Words</em></h1>
          <p class="tagline">Word puzzles for city nights</p>
        </div>

        <div class="home-card">
          <div class="home-label">Now exploring</div>
          <div id="home-city" class="home-city">Tokyo</div>
          <div id="home-district" class="home-district">Shibuya</div>
          <div id="home-dots" class="dots"></div>
        </div>

        <button id="play" class="btn primary big"><span id="play-label">Play</span></button>
      </section>

      <!-- Game -->
      <section id="game" class="screen">
        <header class="topbar">
          <button id="btn-back" class="icon-btn" aria-label="Home"></button>
          <div class="lvl">
            <div id="lvl-district" class="lvl-district"></div>
            <div id="lvl-number" class="lvl-number"></div>
          </div>
          <div class="topbar-right">
            <button class="coins pill" aria-label="Coins">
              <i class="coin-ico"></i><span class="coin-count">0</span><b class="plus">+</b>
            </button>
            <button id="btn-settings-game" class="icon-btn" aria-label="Settings"></button>
          </div>
        </header>

        <div class="board"><div id="grid" class="grid"></div></div>

        <div class="preview-row"><div id="preview" class="preview"></div></div>

        <div class="controls">
          <div class="side left">
            <button id="btn-shuffle" class="round-btn" aria-label="Shuffle letters"></button>
            <button id="btn-extras" class="round-btn ring" aria-label="Extra words">
              <small id="extras-count" class="tag">0/10</small>
            </button>
          </div>
          <div id="wheel" class="wheel" aria-label="Letter wheel"></div>
          <div class="side right">
            <button id="btn-hint-letter" class="round-btn" aria-label="Reveal a letter">
              <small class="tag"><i class="coin-ico"></i><span id="cost-letter">100</span></small>
            </button>
            <button id="btn-hint-word" class="round-btn" aria-label="Reveal a word">
              <small class="tag"><i class="coin-ico"></i><span id="cost-word">200</span></small>
            </button>
          </div>
        </div>
      </section>
    </main>

    <div id="toast-root" aria-live="polite"></div>
    <div id="modal-root"></div>

    <script src="js/config.js"></script>
    <script src="js/words.js"></script>
    <script src="js/rng.js"></script>
    <script src="js/dictionary.js"></script>
    <script src="js/generator.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/themes.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/ads.js"></script>
    <script src="js/wheel.js"></script>
    <script src="js/grid.js"></script>
    <script src="js/game.js"></script>
  </body>
</html>
